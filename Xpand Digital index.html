<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpand Digital | Elite E-commerce & Digital Growth Agency</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #f5f5f5;
            overflow-x: hidden;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #ff8c00 50%, #e65c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(255,107,0,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,107,0,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glass-panel {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 107, 0, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-panel:hover {
            border-color: rgba(255, 107, 0, 0.3);
            background: rgba(30, 30, 30, 0.6);
        }
        .animated-blob {
            filter: blur(120px);
            opacity: 0.15;
            animation: pulse 10s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulse {
            0% { transform: scale(1) translate(0px, 0px); }
            50% { transform: scale(1.2) translate(40px, -30px); }
            100% { transform: scale(0.9) translate(-20px, 20px); }
        }
        
        @keyframes scrollX {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: scrollX 30s linear infinite;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-on-scroll {
            opacity: 0;
            visibility: hidden;
            will-change: opacity, transform;
        }
        .animate-on-scroll.is-visible {
            visibility: visible;
        }
        
        .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in-left { animation: fadeInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in-right { animation: fadeInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scale-in { animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e65c00;
        }

        .glowing-btn {
            position: relative;
        }
        .glowing-btn::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff6b00, #ffb057, #ff6b00);
            z-index: -1;
            border-radius: 0.8rem;
            background-size: 400%;
            animation: glowing 20s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .glowing-btn:hover::before {
            opacity: 1;
        }
        @keyframes glowing {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#050505',
                        brandBlack: '#000000',
                        brandOrange: '#ff6b00',
                        brandOrangeDark: '#e65c00',
                        neutralGray: '#888888',
                        brandWhite: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brandDark text-neutral-100">
    <div id="root"></div>

            { title: "Mobile App Development", icon: "fa-mobile-screen-button", tech: "React Native / Swift", desc: "Native and cross-platform mobile experiences engineered for fluid UI and optimal hardware utilization." },

            { brand: "HomeGlow Co.", market: "Amazon US", impact: "+340% Revenue Growth", tag: "Private Label", desc: "Repositioned home decor listing and restructured PPC targeting. Lowered ACoS from 54% to 21% in 90 days.", image: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=600&q=80&sat=-100" },
            { brand: "NutraPulse Wellness", market: "Web & Shopify", impact: "12.4% Conversion Rate", tag: "Development", desc: "Crafted a custom headless Shopify store with ultra-fast search & seamless checkout experience.", image: "https://images.unsplash.com/photo-1511556532299-8f662fc26c06?auto=format&fit=crop&w=600&q=80&sat=-100" },
            { brand: "Apex Sourcing", market: "Global Sourcing", impact: "$45,000 Saved Annually", tag: "Supply Chain", desc: "Renegotiated direct manufacturing agreements in Ningbo, optimizing shipping logistics to lower per-unit cost by 28%.", image: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80&sat=-100" }
        ];

        const testimonials = [
            { name: "Michael Chen", role: "CEO, AuraTech", text: "The transition to Amazon US was seamless. Their PPC strategy reduced our ACoS by 40% in just two months while doubling our daily unit sales.", rating: 5 },

            { name: "David Alaba", role: "Director, FitGear Pro", text: "Their sourcing team in Asia found us a direct manufacturer that improved product quality while dropping unit cost by $2. Incredible ROI.", rating: 5 }

        const blogs = [
            { title: "Dominating Q4: The Ultimate Amazon PPC Guide", category: "PPC Strategy", date: "Oct 15, 2023", read: "5 min read", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80&sat=-100" },
            { title: "Why Headless Shopify is the Future of E-Commerce", category: "Web Dev", date: "Sep 28, 2023", read: "8 min read", img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80&sat=-100" },
            { title: "Supply Chain Hacks: Reducing Lead Times by 30%", category: "Sourcing", date: "Sep 10, 2023", read: "6 min read", img: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80&sat=-100" }
        ];

            { name: "Launchpad", price: "$2,500", desc: "Perfect for single product brands looking to enter Amazon.", features: ["Market Research & Viability", "Supplier Sourcing & Sampling", "Listing SEO & Copywriting", "Basic PPC Setup & Launch"] },
            { name: "Growth Scale", price: "$5,000", desc: "For established brands scaling aggressively across regions.", features: ["Advanced PPC AI Management", "A+ Premium Content Creation", "Kinetic Video Ads Setup", "Inventory & Logistics Forecasting"], popular: true },
            { name: "Enterprise", price: "Custom", desc: "Full omnichannel ecosystem dominance and management.", features: ["Omnichannel Strategy (Web + FBA)", "Headless Shopify Development", "Dedicated Growth Manager", "Global Expansion (EU/UK/UAE)"] }
        ];

        const faqs = [
            { q: "How long does a typical Amazon Private Label launch take?", a: "From initial market research to product sourcing, manufacturing, and shipping to FBA warehouses, a standard launch timeline ranges from 60 to 90 days depending on manufacturing complexities." },
            { q: "Do you work with brands outside of the US marketplace?", a: "Absolutely. We have dedicated infrastructure and linguistic experts for Amazon UK, Germany, UAE, and KSA marketplaces." },
            { q: "What is your fee structure for PPC Management?", a: "We operate on a flat retainer plus a tiered performance bonus based on achieving agreed-upon TACOS and Revenue targets. This aligns our success directly with yours." },
            { q: "Can you take over an existing, struggling Amazon account?", a: "Yes. Our 'Account Health Recovery' service begins with a deep-dive audit to identify bleeding keywords, listing compliance issues, and logistical bottlenecks before implementing a turnaround strategy." }
        ];

        /* --- ANIMATION COMPONENT --- */
        const AnimatedSection = ({ children, className = "", animation = "fade-in-up", delay = "", threshold = 0.15 }) => {
            const domRef = useRef();
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        setIsVisible(true);
                        if (domRef.current) observer.unobserve(domRef.current);
                    }
                }, { threshold, rootMargin: "0px 0px -50px 0px" });

                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, [threshold]);

            return (
                <div ref={domRef} className={`animate-on-scroll ${isVisible ? `is-visible ${animation} ${delay}` : ''} ${className}`}>
                    {children}
                </div>
            );
        };

        /* --- COMPONENTS --- */
        const Navbar = ({ setPage, activePage }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLink = (page, label) => (
                <button 
                    onClick={() => { setPage(page); setIsOpen(false); }}
                    className={`font-medium text-sm transition-all duration-300 relative py-2 px-3 rounded-xl overflow-hidden group ${activePage === page ? 'text-brandOrange bg-brandOrange/10 shadow-[inset_0_1px_0_rgba(255,107,0,0.2)]' : 'text-neutral-400 hover:text-brandOrange hover:bg-white/5'}`}
                >

            );

                            <div className="flex items-center cursor-pointer group" onClick={() => setPage('home')}>

                                    </span>

                                {navLink('amazon', 'Amazon')}
                                {navLink('creative', 'IT & Creative')}
                                {navLink('works', 'Works')}
                                {navLink('pricing', 'Pricing')}
                                {navLink('testimonials', 'Reviews')}
                                {navLink('blog', 'Insights')}
                                {navLink('about', 'About')}
                                {navLink('careers', 'Careers')}
                            </div>

                            <div className="hidden xl:block">
                                <button 
                                    onClick={() => setPage('contact')} 
                                    className="bg-brandOrange text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:bg-brandOrangeDark transition-all hover:scale-105 flex items-center gap-2 group shadow-[0_0_20px_rgba(255,107,0,0.3)]"
                                >
                                    Consult Us <i className="fas fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                                </button>
                            </div>
                            
                            <div className="xl:hidden">
                                <button 
                                    onClick={() => setIsOpen(!isOpen)} 
                                    className="p-2.5 rounded-xl bg-neutral-900 border border-brandOrange/20 text-brandOrange hover:text-white focus:outline-none transition-colors"
                                >
                                    <i className={`fas ${isOpen ? 'fa-times' : 'fa-bars'} text-xl`}></i>

                            </div>
                        </div>

                    {isOpen && (

                            {['home', 'amazon', 'creative', 'works', 'pricing', 'testimonials', 'blog', 'about', 'careers'].map(page => (

                                    <div className="absolute -right-4 -top-4 w-24 h-24 bg-brandOrange/10 rounded-full blur-2xl group-hover:bg-brandOrange/20 transition-colors"></div>
                                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-brandOrange/20 to-transparent border border-brandOrange/20 flex items-center justify-center text-brandOrange mb-6 group-hover:scale-110 group-hover:rotate-6 transition-transform duration-500 shadow-inner">
                                        <i className={`fas ${stat.icon} text-lg`}></i>
                                    </div>
                                    <div className="text-4xl font-display font-black text-white mb-2 group-hover:-translate-y-1 group-hover:text-brandOrange transition-all duration-300">{stat.stat}</div>
                                    <div className="text-xs text-neutral-400 font-bold uppercase tracking-widest">{stat.label}</div>
                                </div>
                            </AnimatedSection>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ClientMarquee = () => (
            <div className="py-12 border-y border-brandOrange/10 bg-black overflow-hidden relative">
                <div className="absolute inset-y-0 left-0 w-32 bg-gradient-to-r from-black to-transparent z-10"></div>
                <div className="absolute inset-y-0 right-0 w-32 bg-gradient-to-l from-black to-transparent z-10"></div>
                <div className="flex w-[200%] animate-marquee">
                    {[1, 2].map((set) => (
                        <div key={set} className="flex-1 flex justify-around items-center">
                            {['AMAZON ADS PARTNER', 'SHOPIFY PLUS', 'AWS CERTIFIED', 'REACT NATIVE', 'TECHCRUNCH', 'JUNGLE SCOUT'].map((logo, i) => (
                                <span key={i} className="text-xl md:text-2xl font-display font-bold text-white/20 tracking-widest px-8 whitespace-nowrap hover:text-brandOrange transition-colors cursor-default">
                                    {logo}
                                </span>
                            ))}
                        </div>
                    ))}
                </div>
            </div>
        );

        const ServiceExplorer = ({ setPage }) => {
            const [selectedCategory, setSelectedCategory] = useState('amazon');
            
            return (
                <div className="py-32 relative overflow-hidden bg-grid-pattern">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

                                <div className="w-20 h-20 mx-auto rounded-3xl bg-brandOrange/20 flex items-center justify-center text-4xl text-brandOrange mb-8">
                                    <i className="fas fa-paper-plane"></i>
                                </div>
                                <h3 className="text-3xl font-display font-black text-white mb-4">Don't see a perfect fit?</h3>
                                <p className="text-neutral-400 text-base mb-10 max-w-xl mx-auto">Send your resume and portfolio to our HR department. We are always evaluating exceptional talent to expand our operations.</p>
                                <a href="mailto:careers@xpanddigital.com" className="inline-block px-10 py-5 rounded-xl font-bold text-sm bg-brandOrange text-white hover:bg-brandOrangeDark transition-all hover:scale-105 uppercase tracking-widest shadow-lg">
                                    careers@xpanddigital.com
                                </a>
                            </div>
                        </AnimatedSection>
                    </div>
                </div>
            );
        };

        const ContactSection = () => {
            const [status, setStatus] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus("Inquiry submitted successfully! Our growth experts will contact you shortly.");
            };

            return (
                <div id="contact-scroll" className="py-32 relative overflow-hidden border-t border-white/5 bg-brandDark bg-grid-pattern">
                    <div className="absolute left-0 bottom-0 w-[500px] h-[500px] bg-brandOrange/10 rounded-full blur-[120px] pointer-events-none"></div>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-20">
                            <AnimatedSection animation="fade-in-right">
                                <div className="flex flex-col justify-center h-full">
                                    <span className="text-brandOrange text-xs font-bold tracking-widest uppercase border border-brandOrange/20 px-5 py-2.5 rounded-full self-start bg-brandOrange/5">Initiate Consult</span>
                                    <h2 className="font-display text-5xl sm:text-6xl font-black mt-8 text-white mb-8 drop-shadow-lg">Kickstart Expansion.</h2>
                                    <p className="text-neutral-400 leading-relaxed mb-12 text-lg max-w-lg">
                                        Ready to scale your global presence or establish premium web infrastructure? Contact our engineers and designers today to set up your target blueprint.
                                    </p>
                                    
                                    <div className="space-y-8">
                                        <div className="flex items-center gap-6 group">
                                            <div className="w-14 h-14 rounded-2xl bg-brandOrange/10 flex items-center justify-center text-brandOrange border border-brandOrange/20 group-hover:bg-brandOrange group-hover:text-white transition-all duration-300 shadow-inner">
                                                <i className="fas fa-envelope text-xl"></i>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-widest text-neutral-500 mb-1.5">General Inquiries</div>
                                                <div className="text-lg font-bold text-white group-hover:text-brandOrange transition-colors duration-300">hello.xpanddigitals@gmail.com</div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-6 group">
                                            <div className="w-14 h-14 rounded-2xl bg-brandOrange/10 flex items-center justify-center text-brandOrange border border-brandOrange/20 group-hover:bg-brandOrange group-hover:text-white transition-all duration-300 shadow-inner">
                                                <i className="fas fa-phone-volume text-xl"></i>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-widest text-neutral-500 mb-1.5">Instant Communication</div>
                                                <div className="text-lg font-bold text-white group-hover:text-brandOrange transition-colors duration-300">+92 311 4053217</div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-6 group">
                                            <div className="w-14 h-14 rounded-2xl bg-brandOrange/10 flex items-center justify-center text-brandOrange border border-brandOrange/20 group-hover:bg-brandOrange group-hover:text-white transition-all duration-300 shadow-inner">
                                                <i className="fas fa-location-dot text-xl"></i>
                                            </div>
                                            <div>
                                                <div className="text-[10px] font-bold uppercase tracking-widest text-neutral-500 mb-1.5">Operational Hub</div>
                                                <div className="text-lg font-bold text-white group-hover:text-brandOrange transition-colors duration-300">Lahore, Pakistan</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </AnimatedSection>
                            
                            <AnimatedSection animation="fade-in-left">
                                <div className="glass-panel p-8 sm:p-12 rounded-[2.5rem] shadow-2xl relative border-brandOrange/20">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-brandOrange/10 rounded-bl-full"></div>
                                    <form onSubmit={handleSubmit} className="space-y-6 relative z-10">
                                        <div>
                                            <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-widest mb-3">Your Name</label>
                                            <input type="text" required className="w-full bg-black/60 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-brandOrange focus:bg-brandOrange/5 transition-all placeholder-neutral-600" placeholder="Alex Johnson" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-widest mb-3">Email Address</label>
                                            <input type="email" required className="w-full bg-black/60 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-brandOrange focus:bg-brandOrange/5 transition-all placeholder-neutral-600" placeholder="alex@company.com" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-widest mb-3">Service of Interest</label>
                                            <select defaultValue="" className="w-full bg-black/60 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-brandOrange focus:bg-brandOrange/5 transition-all cursor-pointer appearance-none">
                                                <option value="" disabled>Select a Service</option>
                                                <optgroup label="Amazon Services" className="bg-black text-white">
                                                    {amazonServices.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                                </optgroup>
                                                <optgroup label="IT & Creative Services" className="bg-black text-white">
                                                    {creativeServices.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                                </optgroup>
                                                <option value="Other" className="bg-black text-white">Other / Full Package</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-neutral-400 uppercase tracking-widest mb-3">Project Details</label>
                                            <textarea required rows="4" className="w-full bg-black/60 border border-white/10 rounded-xl p-4 text-white focus:outline-none focus:border-brandOrange focus:bg-brandOrange/5 transition-all resize-none placeholder-neutral-600" placeholder="Tell us about your brand goals..."></textarea>
                                        </div>
                                        <button type="submit" className="w-full bg-brandOrange text-white hover:bg-brandOrangeDark transition-all hover:scale-[1.02] py-5 rounded-xl font-black uppercase tracking-widest text-sm shadow-[0_10px_30px_rgba(255,107,0,0.3)]">
                                            Submit Request
                                        </button>
                                        
                                        {status && <div className="mt-4 p-4 bg-brandOrange/10 border border-brandOrange/30 text-brandOrange rounded-xl text-sm font-bold text-center animate-on-scroll is-visible scale-in">{status}</div>}
                                    </form>
                                </div>
                            </AnimatedSection>
                        </div>
                    </div>
                </div>
            );
        };

        const Footer = ({ setPage }) => (
            <footer className="bg-black border-t border-brandOrange/10 pt-24 pb-10 relative overflow-hidden">
                <div className="absolute inset-0 bg-brandOrange/5 pointer-events-none mix-blend-screen"></div>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="grid grid-cols-1 md:grid-cols-12 gap-12 mb-16">
                        <div className="md:col-span-5 text-center md:text-left">
                            <span className="font-display text-3xl font-bold tracking-tight text-white flex items-center justify-center md:justify-start gap-3 mb-6 hover:scale-105 transition-transform origin-left cursor-pointer w-fit" onClick={() => setPage('home')}>
                                <span className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brandOrange to-brandOrangeDark flex items-center justify-center text-lg text-white shadow-lg">
                                    <i className="fas fa-bolt"></i>
                                </span>
                                XPAND<span className="text-brandOrange font-extrabold">DIGITAL</span>
                            </span>
                            <p className="text-neutral-400 text-sm max-w-sm leading-relaxed mb-8 mx-auto md:mx-0">
                                Elite e-commerce and digital growth agency specializing in global marketplace expansion, proven execution, and premium IT production.
                            </p>
                            <div className="flex gap-4 justify-center md:justify-start">
                                <a href="https://www.linkedin.com/in/hamza-zahoor-8a869a249/" target="_blank" className="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white hover:bg-brandOrange hover:text-white hover:border-brandOrange hover:-translate-y-1 transition-all duration-300 shadow-lg"><i className="fab fa-linkedin-in"></i></a>
                                <a href="https://www.facebook.com/hamza.zahoor.897532/" target="_blank" className="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white hover:bg-brandOrange hover:text-white hover:border-brandOrange hover:-translate-y-1 transition-all duration-300 shadow-lg"><i className="fab fa-facebook-f"></i></a>
                                <a href="https://www.instagram.com/hamzabutt1843/" target="_blank" className="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white hover:bg-brandOrange hover:text-white hover:border-brandOrange hover:-translate-y-1 transition-all duration-300 shadow-lg"><i className="fab fa-instagram"></i></a>
                            </div>
                        </div>
                        
                        <div className="md:col-span-7 flex flex-col md:flex-row justify-between gap-10">
                            <div>
                                <h4 className="text-white font-bold mb-6 tracking-wide">Quick Links</h4>
                                <ul className="space-y-4 text-sm text-neutral-400">
                                    <li><button onClick={() => setPage('home')} className="hover:text-brandOrange transition-colors">Home</button></li>
                                    <li><button onClick={() => setPage('about')} className="hover:text-brandOrange transition-colors">About Us</button></li>
                                    <li><button onClick={() => setPage('works')} className="hover:text-brandOrange transition-colors">Works</button></li>
                                    <li><button onClick={() => setPage('pricing')} className="hover:text-brandOrange transition-colors">Pricing</button></li>
                                    <li><button onClick={() => setPage('testimonials')} className="hover:text-brandOrange transition-colors">Reviews</button></li>
                                    <li><button onClick={() => setPage('careers')} className="hover:text-brandOrange transition-colors">Careers</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-6 tracking-wide">Services & More</h4>
                                <ul className="space-y-4 text-sm text-neutral-400">
                                    <li><button onClick={() => setPage('amazon')} className="hover:text-brandOrange transition-colors">Amazon Services</button></li>
                                    <li><button onClick={() => setPage('creative')} className="hover:text-brandOrange transition-colors">IT & Creative</button></li>
                                    <li><button onClick={() => setPage('blog')} className="hover:text-brandOrange transition-colors">Insights</button></li>
                                    <li><button onClick={() => setPage('contact')} className="hover:text-brandOrange transition-colors">Contact Us</button></li>
                                </ul>
                            </div>
                            <div className="max-w-xs">
                                <h4 className="text-white font-bold mb-6 tracking-wide">Insights Newsletter</h4>
                                <p className="text-xs text-neutral-500 mb-4">Get exclusive e-commerce & IT scaling strategies directly to your inbox.</p>
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <input type="email" placeholder="Email address" className="bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brandOrange w-full transition-colors" />
                                    <button className="bg-brandOrange text-white px-4 py-3 rounded-lg font-bold text-sm hover:bg-brandOrangeDark transition-colors whitespace-nowrap shadow-lg">
                                        Subscribe
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center gap-6 text-[10px] text-neutral-500 font-bold uppercase tracking-widest">
                        <div>&copy; {new Date().getFullYear()} Xpand Digital. All rights reserved.</div>
                        <div className="flex gap-6">
                            <a href="#" className="hover:text-brandOrange transition-colors">Privacy Policy</a>
                            <a href="#" className="hover:text-brandOrange transition-colors">Terms of Service</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [activePage, setActivePage] = useState('home');
            
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [activePage]);

            const renderPage = () => {
                switch(activePage) {
                    case 'home': 
                        return (
                            <>
                                <Hero setPage={setActivePage} />
                                <ClientMarquee />
                                <WhyChooseUs />
                                <ServiceExplorer setPage={setActivePage} />
                                <ProcessTimeline />
                                <CaseStudiesSection setPage={setActivePage} />
                                <TestimonialsSection />
                                <InteractiveEstimator />
                                <BlogSection />
                                <FaqAccordion />
                            </>
                        );
                    case 'amazon': return <AmazonPage />;
                    case 'creative': return <CreativePage />;
                    case 'works': return <WorksPage />;
                    case 'pricing': return <PricingPage />;
                    case 'testimonials': return <TestimonialsSection />;
                    case 'blog': return <BlogSection />;
                    case 'about': return <AboutPage />;
                    case 'careers': return <CareersPage />;
                    case 'contact': return <ContactSection />;
                    default: return <Hero setPage={setActivePage} />;
                }
            };

            return (
                <div className="min-h-screen bg-brandDark font-sans flex flex-col">
                    <Navbar setPage={setActivePage} activePage={activePage} />
                    <main className="flex-grow">
                        {renderPage()}
                        {activePage !== 'contact' && activePage !== 'careers' && activePage !== 'home' && <ContactSection />}
                        {activePage === 'home' && <ContactSection />}
                    </main>
                    <Footer setPage={setActivePage} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
